name: Validar IA local
on:
  pull_request:
    paths:
      - 'src/local-ai.mjs'
      - 'bin/w1-local-ai.mjs'
      - 'test/local-ai.test.mjs'
      - 'package.json'
      - '.github/workflows/test-local-ai.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe e testes locais sem provedores externos
        run: |
          node --check src/local-ai.mjs
          node --check bin/w1-local-ai.mjs
          node --test test/local-ai.test.mjs
